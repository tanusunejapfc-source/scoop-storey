<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/jpeg" href="/brand-avatar.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bhaskar Scoop Storey | Collect Happiness • 3D Kawaii Mystery Scoops & Charms</title>
    <meta name="description" content="Official 3D interactive experience for @bhaskar_scoopstorey. Hand-curated mystery scoops, kawaii resin charms, ASMR order packing, and cute collectibles. Collect Happiness." />
    
    <!-- Open Graph -->
    <meta property="og:title" content="Bhaskar Scoop Storey | 3D Mystery Scoops" />
    <meta property="og:description" content="Take an interactive 3D mystery scoop! Curated kawaii charms, ASMR packaging & happiness delivered to your door." />
    <meta property="og:image" content="/brand-avatar.jpg" />
    <meta property="og:type" content="website" />

    <!-- Google Fonts: Fredoka (Playful Kawaii Display), Plus Jakarta Sans (Ultra-clean Modern Body), Caveat (Whimsical Script) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

    <!-- Prevent mobile browsers (Chrome/Safari/Samsung) from auto-scrolling to cached offsets or section hashes on initial open -->
    <script>
      (function() {
        if ('scrollRestoration' in history) {
          history.scrollRestoration = 'manual';
        }
        var h = window.location.hash;
        if (h === '#scoop-machine' || h === '#menu' || h === '#charm-studio' || h === '#reels') {
          try {
            history.replaceState(null, '', window.location.pathname + window.location.search);
          } catch (e) {}
        }
        window.scrollTo(0, 0);
      })();
    </script>
  </head>
  <body class="bg-[#FFF8FA] text-[#2D2A32] antialiased selection:bg-pink-300 selection:text-pink-900">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
